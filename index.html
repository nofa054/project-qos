<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard QoS</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar p-3">
  <h5>MENU</h5>
  <a href="index.html" class="menu active">Dashboard</a>
  <a href="data_qos.html" class="menu">Data QoS</a>
</div>

<!-- CONTENT -->
<div class="content p-4">

<h4>Dashboard Monitoring</h4>

<!-- CARD -->
<div class="row mt-3">
  <div class="col-md-3">
    <div class="card p-3 text-center">
      <h6>Throughput</h6>
      <h4 id="tp">0 Mbps</h4>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card p-3 text-center">
      <h6>Delay</h6>
      <h4 id="delay">0 ms</h4>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card p-3 text-center">
      <h6>Jitter</h6>
      <h4 id="jitter">0 ms</h4>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card p-3 text-center">
      <h6>Packet Loss</h6>
      <h4 id="pl">0%</h4>
    </div>
  </div>
</div>

<!-- GRAFIK -->
<div class="row mt-4">

  <!-- LINE -->
  <div class="col-md-8">
    <div class="card p-3">
      <h5>Throughput Realtime</h5>
      <canvas id="chartQoS"></canvas>
    </div>
  </div>

  <!-- DONUT -->
  <div class="col-md-4">
    <div class="card p-3 text-center">
      <h5>Prediksi (Per Hari / Jam)</h5>
      <canvas id="chartPrediksiHariJam"></canvas>
    </div>
  </div>

</div>

<!-- TABEL -->
<div class="card mt-4 p-3">
  <h5>Riwayat QoS</h5>

  <table class="table mt-3">
    <thead>
      <tr>
        <th>Waktu</th>
        <th>Throughput</th>
        <th>Delay</th>
        <th>Jitter</th>
        <th>Packet Loss</th>
      </tr>
    </thead>
    <tbody id="tableData"></tbody>
  </table>
</div>

</div>

<script src="js/dashboard.js"></script>
</body>
</html>
